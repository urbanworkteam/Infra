# dev 환경 차이만. (app 만, AI/HPA/KEDA 없음)
# B-lite 카나리: gitops 검증 Job 트리거용 주석 (k8s 에이전트 전환 검증 후 제거)
namespace: farmily-dev
app:
  image:
    repository: 851957594139.dkr.ecr.ap-northeast-2.amazonaws.com/farmily-api-dev
    tag: dev-e5ff39a
  roleArn: arn:aws:iam::851957594139:role/dev-eks-app-role
  replicas: 1
  # dev 는 resources 미지정(기본값 {} → 블록 생략)
  env:
    - {name: SPRING_PROFILES_ACTIVE, value: "dev"}
    - {name: APP_VARIANT, value: "eks"} # ★ 버전 마커
    - {name: AWS_REGION, value: "ap-northeast-2"}
    - {name: S3_REGION, value: "ap-northeast-2"}
    - {name: KAKAO_CLIENT_ID, value: "22fb8cb7a66c952ac7b68d8f02662fab"}
    - {name: KAKAO_REDIRECT_URI, value: "http://localhost:3000/oauth/kakao"}
    - {name: PORTONE_IMP_CODE, value: "imp60055885"}
    - {name: PORTONE_TEST_MODE, value: "true"}
    - {name: AUTH_DEV_MASTER_ENABLED, value: "true"}
eso:
  roleArn: arn:aws:iam::851957594139:role/dev-eks-eso-reader-role
  paths:
    - farmily/dev/app
    - farmily/dev/app-infra
# dev 는 미사용
ai: {enabled: false}
hpa: {enabled: false}
keda: {enabled: false}
targetGroupArn: arn:aws:elasticloadbalancing:ap-northeast-2:851957594139:targetgroup/dev-eks-tg/f94ef7701a2bda39
